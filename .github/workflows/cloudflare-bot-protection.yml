name: Configure Cloudflare bot protection

on:
  push:
    branches:
      - ops/cloudflare-bot-protection
    paths:
      - .github/workflows/cloudflare-bot-protection.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Apply safe bot protection settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is not configured");

          async function cloudflare(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(init.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) {
              const message = (payload.errors || [])
                .map((error) => error.message)
                .filter(Boolean)
                .join("; ");
              throw new Error(`Cloudflare API ${response.status}: ${message || "request failed"}`);
            }
            return payload.result;
          }

          const zones = await cloudflare("/zones?name=emaalbs.com&status=active");
          if (zones.length !== 1) {
            throw new Error(`Expected one active emaalbs.com zone, found ${zones.length}`);
          }

          const zoneId = zones[0].id;
          const before = await cloudflare(`/zones/${zoneId}/bot_management`);
          const has = (key) => Object.prototype.hasOwnProperty.call(before, key);
          const desired = {
            sbfm_definitely_automated: "managed_challenge",
            sbfm_verified_bots: "allow",
          };

          if (has("sbfm_likely_automated")) {
            desired.sbfm_likely_automated = "managed_challenge";
          }
          if (has("sbfm_static_resource_protection")) {
            desired.sbfm_static_resource_protection = false;
          }
          if (has("optimize_wordpress")) {
            desired.optimize_wordpress = false;
          }
          if (has("enable_js")) {
            desired.enable_js = true;
          }
          if (has("fight_mode") && before.fight_mode) {
            desired.fight_mode = false;
          }

          const after = await cloudflare(`/zones/${zoneId}/bot_management`, {
            method: "PUT",
            body: JSON.stringify(desired),
          });

          const expected = Object.entries(desired);
          const mismatches = expected.filter(([key, value]) => after[key] !== value);
          if (mismatches.length) {
            throw new Error(`Cloudflare did not retain: ${mismatches.map(([key]) => key).join(", ")}`);
          }

          console.log("Cloudflare bot protection configured successfully.");
          console.log(JSON.stringify(Object.fromEntries(expected), null, 2));
          NODE
